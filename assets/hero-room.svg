<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" fill="none">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0D1C"/><stop offset=".48" stop-color="#242039"/><stop offset="1" stop-color="#0B0A12"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222032"/><stop offset=".55" stop-color="#100D20"/><stop offset="1" stop-color="#372537"/></linearGradient>
 <linearGradient id="floor" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#241725"/><stop offset="1" stop-color="#07070B"/></linearGradient>
 <linearGradient id="seat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70506C"/><stop offset=".38" stop-color="#35283B"/><stop offset="1" stop-color="#0B0B15"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E05FFF" stop-opacity=".44"/><stop offset=".4" stop-color="#C06DFF" stop-opacity=".04"/><stop offset="1" stop-color="#3D3159" stop-opacity=".3"/></linearGradient>
 <radialGradient id="hot"><stop stop-color="#C650F2" stop-opacity=".59"/><stop offset="1" stop-color="#C650F2" stop-opacity="0"/></radialGradient>
 <radialGradient id="cold"><stop stop-color="#859CFF" stop-opacity=".45"/><stop offset="1" stop-color="#859CFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="light"><stop stop-color="#FFE1D0" stop-opacity=".28"/><stop offset="1" stop-color="#FFE1D0" stop-opacity="0"/></radialGradient>
 <pattern id="hatch" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(31)"><path d="M0 0V36" stroke="#F1D3FF" stroke-opacity=".045" stroke-width="1"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
 <filter id="blur10"><feGaussianBlur stdDeviation="11"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer></filter>
</defs>
